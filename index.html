<!DOCTYPE html>
<html lang="en">
<head>
  <title>Limitless - The Open Academic Archive</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The free and open source archive of high quality notes and academic resources for degree college in India">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <!-- Collapsible Sidebar Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    /* Default site font */
    :root {
      --site-font: Arial, Helvetica, "Segoe UI", sans-serif;
    }
    body,
    .sidebar,
    .markdown-section,
    .search input,
    #cusdis_thread {
      font-family: var(--site-font) !important;
    }

    /* Remove the site name header from the sidebar completely */
    .app-name,
    .sidebar > h1 {
      display: none !important;
    }

    /* Smooth sidebar transition */
    .sidebar,
    .content {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  left 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  padding-left 0.4s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }

    /* Responsive container for YouTube embeds */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      margin: 1.5rem 0;
      border-radius: 8px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* App Loader */
    .app-loader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 85vh;
      font-family: var(--site-font);
    }

    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #e5e7eb;
      border-top-color: #42b983;
      border-radius: 50%;
      animation: 
        spin 0.85s linear infinite,
        dynamicHue 8s ease-in-out infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dynamicHue {
      0%   { border-top-color: #000000; border-right-color: #000000; }
      25%  { border-top-color: #7c3aed; border-right-color: #7c3aed; }
      50%  { border-top-color: #db2777; border-right-color: #db2777; }
      75%  { border-top-color: #059669; border-right-color: #059669; }
      100% { border-top-color: #000000; border-right-color: #000000; }
    }

    /* Top-Right Hamburger Menu with Dynamic Contrast Background */
    .sidebar-toggle {
      position: fixed !important;
      top: 14px !important;
      right: 14px !important;
      left: auto !important;
      bottom: auto !important;
      width: 38px !important;
      height: 38px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18) !important;
      cursor: pointer;
      z-index: 1000 !important;
      padding: 0 !important;
      transition: background-color 0.25s ease, color 0.25s ease;
      background-color: #1e293b !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }
    .sidebar-toggle span {
      background-color: #ffffff !important;
      height: 2px !important;
      width: 18px !important;
      margin: 2px 0 !important;
      border-radius: 2px;
      transition: background-color 0.25s ease;
    }

    body.dark .sidebar-toggle,
    [data-theme="dark"] .sidebar-toggle {
      background-color: #ffffff !important;
      border-color: rgba(0, 0, 0, 0.1) !important;
    }
    body.dark .sidebar-toggle span,
    [data-theme="dark"] .sidebar-toggle span {
      background-color: #0f172a !important;
    }

    /* Dark/Light Toggle with Dynamic Contrast Background */
    #docsify-darklight-theme {
      position: fixed !important;
      right: 20px !important;
      bottom: 20px !important;
      top: auto !important;
      left: auto !important;
      z-index: 9999 !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2) !important;
      border-radius: 50% !important;
      transition: background-color 0.25s ease, color 0.25s ease !important;
      background-color: #1e293b !important;
      color: #ffffff !important;
    }
    #docsify-darklight-theme svg {
      fill: #ffffff !important;
      stroke: #ffffff !important;
    }

    body.dark #docsify-darklight-theme,
    [data-theme="dark"] #docsify-darklight-theme {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    body.dark #docsify-darklight-theme svg,
    [data-theme="dark"] #docsify-darklight-theme svg {
      fill: #0f172a !important;
      stroke: #0f172a !important;
    }

    /* Centered, adaptive comment container */
    #cusdis_thread {
      margin: 50px auto 30px auto !important;
      padding: 24px 0 0 0;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
      width: 100% !important;
      max-width: 640px !important;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #cusdis_thread iframe {
      width: 100% !important;
      min-height: 480px;
      border: none !important;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading Limitless Archive</div>
    </div>
  </div>

  <script>
    // Custom Cusdis configuration removing email and preserving 'Comment' button text
    window.CUSDIS_CONFIG = {
      fields: ['nickname']
    };

    window.$docsify = {
      name: '', // Cleared site title
      repo: '',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,

      darklightTheme: {
        siteFont: 'Arial, Helvetica, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        dark: {
          accent: '#38bdf8',
          background: '#0f172a',
          textColor: '#f1f5f9',
          codeBackgroundColor: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f8fafc'
        }
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search notes...',
        noData: 'No results found',
        depth: 3
      },

      plugins: [
        function (hook, vm) {
          function currentSiteTheme() {
            var bg = getComputedStyle(document.body).backgroundColor;
            var match = bg.match(/\d+/g);
            if (!match) return 'light';
            var r = +match[0], g = +match[1], b = +match[2];
            var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance < 0.5 ? 'dark' : 'light';
          }

          function syncCusdisTheme() {
            var container = document.getElementById('cusdis_thread');
            if (!container) return;
            var theme = currentSiteTheme();
            if (container.getAttribute('data-theme') !== theme) {
              container.setAttribute('data-theme', theme);
              if (window.CUSDIS) {
                window.CUSDIS.renderTo(container);
              }
            }
          }

          // Injects custom CSS directly into the Cusdis iframe to remove the Email field row
          function cleanCusdisIframe() {
            var iframe = document.querySelector('#cusdis_thread iframe');
            if (!iframe) return;

            function stripEmail() {
              try {
                var doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc || doc.getElementById('cusdis-clean-styles')) return;

                var style = doc.createElement('style');
                style.id = 'cusdis-clean-styles';
                style.textContent = `
                  /* Hide the email label, input field, and its container */
                  input[name="email"],
                  input[type="email"],
                  label[for="email"],
                  div:has(> input[name="email"]),
                  div:has(> input[type="email"]) {
                    display: none !important;
                  }
                  /* Make nickname occupy full width */
                  input[name="nickname"],
                  div:has(> input[name="nickname"]) {
                    width: 100% !important;
                    flex: 1 1 100% !important;
                  }
                `;
                doc.head.appendChild(style);
              } catch (e) {
                // Cross-origin fallback handled via data-fields
              }
            }

            iframe.addEventListener('load', stripEmail);
            stripEmail();
          }

          hook.doneEach(function () {
            var container = document.getElementById('cusdis_thread');
            if (!container) {
              container = document.createElement('div');
              container.id = 'cusdis_thread';
              var contentElem = document.querySelector('.content');
              if (contentElem) {
                contentElem.appendChild(container);
              }
            }

            container.setAttribute('data-host', 'https://cusdis.com');
            container.setAttribute('data-app-id', 'c340a0ca-72a7-41cb-b1fe-4df40bd78033');
            container.setAttribute('data-page-id', vm.route.file || 'home');
            container.setAttribute('data-page-url', window.location.href);
            container.setAttribute('data-page-title', vm.route.file || 'Home');
            container.setAttribute('data-theme', currentSiteTheme());

            // Set single field and default button text
            container.setAttribute('data-fields', 'nickname');
            container.setAttribute('data-config', JSON.stringify({
              fields: ['nickname'],
              i18n: {
                comment: 'Comment',
                nickname: 'Nickname',
                reply: 'Reply'
              }
            }));

            if (window.CUSDIS) {
              window.CUSDIS.renderTo(container);
            }

            cleanCusdisIframe();

            if (!window.__cusdisThemeObserver) {
              window.__cusdisThemeObserver = new MutationObserver(syncCusdisTheme);
              window.__cusdisThemeObserver.observe(document.body, {
                attributes: true,
                attributeFilter: ['class', 'style', 'data-theme']
              });
              window.__cusdisThemeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['class', 'style', 'data-theme']
              });
            }
          });
        }
      ]
    }
  </script>

  <!-- Core Docsify Engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cusdis.com/js/cusdis.umd.js" async defer></script>
</body>
</html>
