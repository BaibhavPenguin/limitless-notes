<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./LOGO-NO-BG.png" type="image/x-icon">
  <title>Limitless - The Open Academic Archive | Degree College Notes</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The free and open source archive of high quality notes and academic resources for degree college in India">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <!-- Collapsible Sidebar Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <!-- Site wide Styles for Sidebar , Tables and Buttons-->
  <link rel="stylesheet" href="./styles/index.css">

  <!-- Syntax Highlighting for Python Editor (Prism) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

</head>
<body>
  <!-- ================= TOP HEADER / NAVBAR ================= -->
  <header class="site-header">
    <div class="site-header-left">
      <!-- 
        =========================================================
        LOGO PLACEHOLDER
        Replace the <img> src or content inside this anchor tag.
        =========================================================
      -->
      <a href="#/" class="header-brand">
        <img src="./LOGO-NO-BG.png" alt="Limitless Logo" class="brand-logo">
        <span class="brand-title">Limitless</span>
      </a>
      <!-- ======================================================= -->
    </div>

    <!-- Container slot where Docsify's toggle button will be mounted -->
    <div class="site-header-right" id="header-toggle-slot"></div>
  </header>
  <!-- ======================================================= -->

  <div id="app">
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading Limitless Archive</div>
    </div>
  </div>

  <script>
    window.$docsify = {
      name: '',
      repo: '',
      homepage: 'Homepage.md',
      loadSidebar: true,
      auto2top: true,

      darklightTheme: {
        siteFont: 'Arial, Helvetica, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        dark: {
          accent: '#38bdf8',
          background: '#0f172a',
          textColor: '#f1f5f9',
          codeBackgroundColor: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f8fafc'
        }
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search archive...',
        noData: 'No results found',
        depth: 3
      },

      plugins: [
        function(hook) {
          var footer = [
            '<footer class="site-footer">',
            'Made with <span class="heart">❤️</span> by Baibhav Bhattacharya, Prem Vishvakarma & Ankush Yadav',
            '</footer>'
          ].join('');

          hook.afterEach(function(html) {
            return html + footer;
          });

          // Mount layout controls and initialize Python sandboxes on every Docsify route render
          hook.doneEach(function() {
            var toggleBtn = document.querySelector('.sidebar-toggle');
            var slot = document.getElementById('header-toggle-slot');
            if (toggleBtn && slot && !slot.contains(toggleBtn)) {
              slot.appendChild(toggleBtn);
            }

            // Sync Python status badges & initial syntax highlighting when new pages render
            if (typeof updatePyodideBadges === 'function') {
              updatePyodideBadges(!!window.__isPyodideReady);
            }
            document.querySelectorAll('.pysource textarea').forEach(function(textarea) {
              if (typeof syncPyHighlight === 'function') {
                syncPyHighlight(textarea);
              }
            });
          });
        }
      ]
    }
  </script>

  <!-- Core Docsify Engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var sidebar = document.querySelector('.sidebar');
    var content = document.querySelector('.content');

    if (!sidebar) return;

    // 1. Stop any clicks inside the sidebar from reaching Docsify's mobile auto-close listener
    sidebar.addEventListener('click', function (e) {
      e.stopPropagation();
    });

    // 2. Only close the sidebar when the user taps outside on the main page content
    if (content) {
      content.addEventListener('click', function () {
        if (window.innerWidth <= 768 && !document.body.classList.contains('close')) {
          document.body.classList.add('close');
        }
      });
    }
  });
  </script>

  <!-- Global Shared Pyodide Worker & Execution Manager -->
  <script>
    (function () {
      const workerCode = `
        importScripts('https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js');

        let pyodidePromise = (async () => {
          const pyodide = await loadPyodide();
          return pyodide;
        })();

        self.onmessage = async (event) => {
          const pyodide = await pyodidePromise;
          const { code, type } = event.data;

          if (type === 'init') {
            self.postMessage({ type: 'ready' });
            return;
          }

          let output = [];
          const decoder = new TextDecoder('utf-8');

          pyodide.setStdout({
            batched: (str) => { output.push(str); },
            raw: (buf) => { output.push(decoder.decode(buf)); }
          });

          try {
            await pyodide.loadPackagesFromImports(code);
            let result = await pyodide.runPythonAsync(code);
            let outputText = output.join('');
            
            if (result !== undefined && result !== null) {
              outputText += (outputText ? '\\n' : '') + String(result);
            }
            self.postMessage({ type: 'result', success: true, output: outputText });
          } catch (err) {
            self.postMessage({ type: 'result', success: false, error: err.message });
          }
        };
      `;

      const blob = new Blob([workerCode], { type: 'application/javascript' });
      window.__sharedPyWorker = new Worker(URL.createObjectURL(blob));

      // Global event listener for Pyodide initialization
      window.__sharedPyWorker.addEventListener('message', function (e) {
        if (e.data.type === 'ready') {
          window.__isPyodideReady = true;
          if (typeof updatePyodideBadges === 'function') {
            updatePyodideBadges(true);
          }
        }
      });

      // Warmup signal
      window.__sharedPyWorker.postMessage({ type: 'init' });
    })();

    // Updates status badge indicators sitewide
    function updatePyodideBadges(isReady) {
      document.querySelectorAll('.py-status-badge').forEach(function (badge) {
        if (isReady) {
          badge.classList.add('ready');
          badge.querySelector('.py-status-text').textContent = 'Python Ready';
        } else {
          badge.classList.remove('ready');
          badge.querySelector('.py-status-text').textContent = 'Loading...';
        }
      });
    }

    // Live Syntax Highlighter sync for textarea
    function syncPyHighlight(textarea) {
      const pysource = textarea.closest('.pysource');
      if (!pysource) return;
      const codeEl = pysource.querySelector('pre code');
      if (!codeEl) return;

      codeEl.textContent = textarea.value + (textarea.value.endsWith('\n') ? ' ' : '');
      if (window.Prism) {
        Prism.highlightElement(codeEl);
      }
    }

    // Synchronize scroll position between textarea and Prism overlay
    function syncPyScroll(textarea) {
      const pysource = textarea.closest('.pysource');
      if (!pysource) return;
      const preEl = pysource.querySelector('pre');
      if (preEl) {
        preEl.scrollTop = textarea.scrollTop;
        preEl.scrollLeft = textarea.scrollLeft;
      }
    }

    // Global Run Button Handler
    function runPythonCode(buttonEl) {
      const island = buttonEl.closest('.py-island');
      if (!island) return;

      const sourceArea = island.querySelector('.pysource textarea');
      const outputPre = island.querySelector('.pyterm pre');

      if (!sourceArea || !outputPre) return;

      if (!window.__sharedPyWorker) {
        outputPre.className = 'py-output py-err';
        outputPre.textContent = 'Error: Shared Pyodide worker script not initialized.';
        return;
      }

      const code = sourceArea.value;
      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Running...';
      outputPre.className = 'py-output';
      outputPre.textContent = 'Executing...';

      const handleResult = function (e) {
        if (e.data.type === 'ready') {
          window.__isPyodideReady = true;
          updatePyodideBadges(true);
          return;
        }

        if (e.data.type === 'result') {
          window.__sharedPyWorker.removeEventListener('message', handleResult);
          buttonEl.disabled = false;
          buttonEl.innerHTML = originalText;

          if (e.data.success) {
            outputPre.textContent = e.data.output || '(Execution completed with no output)';
          } else {
            outputPre.className = 'py-output py-err';
            outputPre.textContent = e.data.error;
          }
        }
      };

      window.__sharedPyWorker.addEventListener('message', handleResult);
      window.__sharedPyWorker.postMessage({ type: 'run', code });
    }
  </script>

</body>
</html>
