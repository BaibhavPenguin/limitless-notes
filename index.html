        <button class="sandbox-modal-btn submit" id="sandbox-modal-submit">Enter</button>

  <script>
    window.$docsify = {
      name: '',
      repo: '',
      homepage: 'Homepage.md',
      loadSidebar: true,
      auto2top: true,

      darklightTheme: {
        siteFont: 'Arial, Helvetica, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        dark: {
          accent: '#38bdf8',
          background: '#0f172a',
          textColor: '#f1f5f9',
          codeBackgroundColor: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f8fafc'
        }
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results found',
        depth: 3
      },

      plugins: [
        function(hook) {
          var footer = [
            '<footer class="site-footer">',
            'Made with <span class="heart">❤️</span> by Baibhav Bhattacharya, Prem Vishwakarma & Ankush Yadav',
            '</footer>'
          ].join('');

          hook.afterEach(function(html) {
            return html + footer;
          });

          hook.doneEach(function() {
            var toggleBtn = document.querySelector('.sidebar-toggle');
            var slot = document.getElementById('header-toggle-slot');
            if (toggleBtn && slot && !slot.contains(toggleBtn)) {
              slot.appendChild(toggleBtn);
            }

            if (window.__isPyodideReady) {
              updatePyodideBadges('ready');
            }
            if (window.__isWebRReady) {
              updateWebRBadges('ready');
            }
            if (window.__isMySQLReady) {
              updateMySQLBadges('ready');
            }

            document.querySelectorAll('.code-source textarea, .webrsource textarea, .pysource textarea').forEach(function(textarea) {
              updateCodeGutter(textarea);
            });

            document.querySelectorAll('.mysql-line-edit').forEach(function(el) {
              autoExpandSQLEdit(el);
            });

            if (document.querySelector('.py-island, .code-island .py-status-badge')) {
              ensurePyodide();
            }
            if (document.querySelector('.webr-island, .webr-status-badge')) {
              ensureWebR();
            }
            if (document.querySelector('.mysql-island, .mysql-status-badge')) {
              ensureMySQL();
            }
          });
        }
      ]
    };
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var sidebar = document.querySelector('.sidebar');
    var content = document.querySelector('.content');
    if (!sidebar) return;

    sidebar.addEventListener('click', function (e) {
      e.stopPropagation();
    });

    if (content) {
      content.addEventListener('click', function () {
        if (window.innerWidth <= 768 && !document.body.classList.contains('close')) {
          document.body.classList.add('close');
        }
      });
    }
  });
  </script>

  <script>
    function updateCodeGutter(textarea) {
      const container = textarea.closest('.code-source') || textarea.closest('.webrsource') || textarea.closest('.pysource');
      if (!container) return;
      const gutter = container.querySelector('.code-gutter') || container.querySelector('.webr-gutter') || container.querySelector('.py-line-numbers');
      if (!gutter) return;

      const lineCount = textarea.value.split('\n').length;
      let numbers = '';
      for (let i = 1; i <= lineCount; i++) {
        numbers += i + '\n';
      }
      gutter.textContent = numbers.slice(0, -1);
    }

    function syncCodeGutterScroll(textarea) {
      const container = textarea.closest('.code-source') || textarea.closest('.webrsource') || textarea.closest('.pysource');
      if (!container) return;
      const gutter = container.querySelector('.code-gutter') || container.querySelector('.webr-gutter') || container.querySelector('.py-line-numbers');
      if (gutter) {
        gutter.scrollTop = textarea.scrollTop;
      }
    }

    function autoExpandSQLEdit(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 240) + 'px';
    }

    function handleSQLKeyDown(e, textarea) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const island = textarea.closest('.mysql-island');
        const enterBtn = island ? island.querySelector('.mysql-enter-btn') : null;
        if (enterBtn && !enterBtn.disabled) {
          enterBtn.click();
        }
      }
    }

    function clearMySQLTerminal(buttonEl) {
      const island = buttonEl.closest('.mysql-island');
      if (!island) return;
      const outputPre = island.querySelector('.mysqlterm pre');
      if (outputPre) {
        outputPre.textContent = '';
        outputPre.className = 'mysql-output';
      }
    }

    function downloadWebRPlot(buttonEl) {
      const plotContainer = buttonEl.closest('.webr-plot-container');
      if (!plotContainer) return;
      const canvas = plotContainer.querySelector('canvas');
      if (!canvas) return;

      const link = document.createElement('a');
      link.download = 'plot.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function requestSandboxInput(promptText, titleText = "Program Input", isR = false) {
      return new Promise((resolve, reject) => {
        const backdrop = document.getElementById('sandbox-modal-backdrop');
        const titleEl = document.getElementById('sandbox-modal-title');
        const promptEl = document.getElementById('sandbox-modal-prompt');
        const inputEl = document.getElementById('sandbox-modal-input');
        const submitBtn = document.getElementById('sandbox-modal-submit');
        const cancelBtn = document.getElementById('sandbox-modal-cancel');

        titleEl.textContent = titleText;
        promptEl.textContent = promptText || "Enter input:";
        inputEl.value = "";

        if (isR) {
          submitBtn.classList.add('r-btn');
        } else {
          submitBtn.classList.remove('r-btn');
        }

        backdrop.classList.add('active');
        inputEl.focus();

        function cleanup() {
          backdrop.classList.remove('active');
          submitBtn.removeEventListener('click', onDone);
          cancelBtn.removeEventListener('click', onCancel);
          inputEl.removeEventListener('keydown', onKey);
        }

        function onDone() {
          const val = inputEl.value;
          cleanup();
          resolve(val);
        }

        function onCancel() {
          cleanup();
          reject(new Error("Input cancelled by user."));
        }

        function onKey(e) {
          if (e.key === 'Enter') onDone();
          if (e.key === 'Escape') onCancel();
        }

        submitBtn.addEventListener('click', onDone);
        cancelBtn.addEventListener('click', onCancel);
        inputEl.addEventListener('keydown', onKey);
      });
    }
  </script>

  <!-- Python / Pyodide -->
  <script>
    let pyodideInstance = null;
    window.__isPyodideLoading = false;
    window.__isPyodideReady = false;

    function updatePyodideBadges(status) {
      document.querySelectorAll('.py-status-badge').forEach(function(badge) {
        if (status === 'ready') {
          badge.className = 'py-status-badge ready';
          badge.querySelector('.py-status-text').textContent = 'Python Ready';
        } else if (status === 'loading') {
          badge.className = 'py-status-badge';
          badge.querySelector('.py-status-text').textContent = 'Initializing...';
        } else {
          badge.className = 'py-status-badge';
          badge.querySelector('.py-status-text').textContent = 'Waiting...';
        }
      });
    }

    async function ensurePyodide() {
      if (window.__isPyodideReady) return pyodideInstance;
      if (window.__isPyodideLoading) {
        while (!window.__isPyodideReady) {
          await new Promise(r => setTimeout(r, 100));
        }
        return pyodideInstance;
      }

      window.__isPyodideLoading = true;
      updatePyodideBadges('loading');

      try {
        if (!window.loadPyodide) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        pyodideInstance = await loadPyodide();
        window.__isPyodideReady = true;
        window.__isPyodideLoading = false;
        updatePyodideBadges('ready');
        return pyodideInstance;
      } catch (err) {
        window.__isPyodideLoading = false;
        console.error('Failed to load Pyodide:', err);
        throw err;
      }
    }

    async function runPythonCode(buttonEl) {
      const island = buttonEl.closest('.code-island') || buttonEl.closest('.py-island');
      if (!island) return;

      const sourceArea = island.querySelector('.code-source textarea') || island.querySelector('.pysource textarea');
      const outputPre = island.querySelector('.code-term pre') || island.querySelector('.pyterm pre');
      if (!sourceArea || !outputPre) return;

      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Running...';
      outputPre.className = 'py-output';
      outputPre.textContent = 'Loading packages...';

      try {
        const py = await ensurePyodide();
        await py.loadPackagesFromImports(sourceArea.value);

        outputPre.textContent = 'Executing...';

        py.setStdin({
          stdin: () => {
            const res = window.prompt("Python input():");
            return res !== null ? res + "\n" : "\n";
          }
        });

        let code = sourceArea.value;
        const inputMatches = [...code.matchAll(/input\s*\(\s*(?:["'](.*?)["'])?\s*\)/g)];
        const userValues = [];
        for (const match of inputMatches) {
          const promptText = match[1] || "Enter value:";
          const userInput = await requestSandboxInput(promptText, "Python Input Prompt", false);
          userValues.push(userInput);
        }

        let pyInputIdx = 0;
        code = code.replace(/input\s*\(\s*(?:["'](.*?)["'])?\s*\)/g, () => {
          return JSON.stringify(userValues[pyInputIdx++]);
        });

        py.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
        const result = await py.runPythonAsync(code);
        let stdout = py.runPython("sys.stdout.getvalue()");
        let stderr = py.runPython("sys.stderr.getvalue()");

        let finalOutput = '';
        if (stdout) finalOutput += stdout;
        if (stderr) finalOutput += (finalOutput ? '\n' : '') + stderr;
        if (result !== undefined && result !== null) {
          finalOutput += (finalOutput ? '\n' : '') + String(result);
        }

        outputPre.textContent = finalOutput.trim() || '(Execution completed with no output)';
      } catch (err) {
        outputPre.className = 'py-output py-err';
        outputPre.textContent = err.message;
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalText;
      }
    }
  </script>

  <!-- R / WebR -->
  <script type="module">
    let webrInstance = null;
    window.__isWebRLoading = false;
    window.__isWebRReady = false;

    window.updateWebRBadges = function(status) {
      document.querySelectorAll('.webr-status-badge').forEach(function(badge) {
        if (status === 'ready') {
          badge.className = 'webr-status-badge ready';
          badge.querySelector('.webr-status-text').textContent = 'R Ready';
        } else if (status === 'loading') {
          badge.className = 'webr-status-badge';
          badge.querySelector('.webr-status-text').textContent = 'Initializing...';
        } else {
          badge.className = 'webr-status-badge';
          badge.querySelector('.webr-status-text').textContent = 'Waiting...';
        }
      });
    };

    window.ensureWebR = async function() {
      if (window.__isWebRReady) return webrInstance;
      if (window.__isWebRLoading) {
        while (!window.__isWebRReady) {
          await new Promise(r => setTimeout(r, 100));
        }
        return webrInstance;
      }

      window.__isWebRLoading = true;
      window.updateWebRBadges('loading');

      try {
        const { WebR } = await import('https://webr.r-wasm.org/v0.3.3/webr.mjs');
        webrInstance = new WebR();
        await webrInstance.init();
        window.__isWebRReady = true;
        window.__isWebRLoading = false;
        window.updateWebRBadges('ready');
        return webrInstance;
      } catch (err) {
        window.__isWebRLoading = false;
        console.error('Failed to load WebR:', err);
        throw err;
      }
    };

    window.runWebRCode = async function(buttonEl) {
      const island = buttonEl.closest('.webr-island') || buttonEl.closest('.code-island');
      if (!island) return;

      const sourceArea = island.querySelector('.webrsource textarea') || island.querySelector('.code-source textarea');
      const outputPre = island.querySelector('.webrterm pre') || island.querySelector('.code-term pre');
      const plotContainer = island.querySelector('.webr-plot-container');
      const plotCanvas = island.querySelector('.webr-plot-canvas');

      if (!sourceArea || !outputPre) return;

      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Running...';
      outputPre.className = 'webr-output';
      outputPre.textContent = 'Executing...';

      if (plotContainer) {
        plotContainer.classList.remove('has-plot');
      }
      if (plotCanvas) {
        const ctx = plotCanvas.getContext('2d');
        ctx.clearRect(0, 0, plotCanvas.width, plotCanvas.height);
      }

      try {
        const r = await window.ensureWebR();
        let code = sourceArea.value;

        const readlineMatches = [...code.matchAll(/readline\s*\(\s*(?:prompt\s*=\s*)?["'](.*?)["']\s*\)/g)];
        const rValues = [];
        for (const match of readlineMatches) {
          const promptText = match[1] || "Enter R input:";
          const userInput = await requestSandboxInput(promptText, "R Input Prompt", true);
          rValues.push(userInput);
        }

        let rInputIdx = 0;
        code = code.replace(/readline\s*\(\s*(?:prompt\s*=\s*)?["'](.*?)["']\s*\)/g, () => {
          return JSON.stringify(rValues[rInputIdx++]);
        });

        const shelter = await new r.Shelter();
        const capture = await shelter.captureR(code, {
          withAutoprint: true,
          captureStreams: true,
          captureConditions: true,
          captureGraphics: true
        });

        let outputText = '';
        if (capture.output && capture.output.length > 0) {
          outputText = capture.output
            .filter(item => item.type === 'stdout' || item.type === 'stderr')
            .map(item => item.data)
            .join('\n');
        }

        if (capture.images && capture.images.length > 0 && plotCanvas && plotContainer) {
          const lastImg = capture.images[capture.images.length - 1];
          if (lastImg) {
            plotCanvas.width = lastImg.width || 600;
            plotCanvas.height = lastImg.height || 400;
            const ctx = plotCanvas.getContext('2d');
            ctx.drawImage(lastImg, 0, 0);
            plotContainer.classList.add('has-plot');
          }
        }

        await shelter.purge();
        outputPre.textContent = outputText.trim() || '(Execution completed with no output)';
      } catch (err) {
        outputPre.className = 'webr-output webr-err';
        outputPre.textContent = err.message;
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalText;
      }
    };
  </script>

  <!-- MySQL / lite4mariadb (Self-Hosted via C-WASM ABI) -->
  <script type="module">
    let mariadbModule = null;
    let mariadbDbHandle = 0;
    window.__isMySQLLoading = false;
    window.__isMySQLReady = false;

    window.updateMySQLBadges = function(status) {
      document.querySelectorAll('.mysql-status-badge').forEach(function(badge) {
        if (status === 'ready') {
          badge.className = 'mysql-status-badge ready';
          badge.querySelector('.mysql-status-text').textContent = 'MariaDB Ready';
        } else if (status === 'loading') {
          badge.className = 'mysql-status-badge';
          badge.querySelector('.mysql-status-text').textContent = 'Initializing...';
        } else {
          badge.className = 'mysql-status-badge';
          badge.querySelector('.mysql-status-text').textContent = 'Waiting...';
        }
      });
    };

    window.ensureMySQL = async function() {
      if (window.__isMySQLReady && mariadbModule) return mariadbModule;
      if (window.__isMySQLLoading) {
        while (!window.__isMySQLReady) {
          await new Promise(r => setTimeout(r, 100));
        }
        return mariadbModule;
      }

      window.__isMySQLLoading = true;
      window.updateMySQLBadges('loading');

      try {
        const basePath = new URL('./vendor/lite4mariadb/', window.location.href).href;
        const mod = await import(basePath + 'lite4mariadb.js');

        const Factory = 
          mod.Lite4MariaDB || 
          mod.MariaDB || 
          mod.createMariaDB || 
          (typeof mod.default === 'function' ? mod.default : mod.default?.Lite4MariaDB || mod.default?.MariaDB);

        const options = {
          locateFile: (file) => basePath + file,
          mainScriptUrlOrBlob: basePath + 'lite4mariadb.worker.js'
        };

        let inst = null;
        if (typeof Factory === 'function') {
          try {
            inst = await Factory(options);
          } catch (e) {
            inst = new Factory(options);
          }
        } else if (typeof mod.create === 'function') {
          inst = await mod.create(options);
        } else if (typeof mod.default === 'object' && mod.default !== null) {
          inst = mod.default;
        } else {
          inst = mod;
        }

        mariadbModule = inst;

        if (typeof mariadbModule._l4m_open === 'function') {
          try {
            mariadbDbHandle = mariadbModule._l4m_open();
          } catch (e) {
            mariadbDbHandle = 1;
          }
        }

        window.__isMySQLReady = true;
        window.__isMySQLLoading = false;
        window.updateMySQLBadges('ready');
        return mariadbModule;
      } catch (err) {
        window.__isMySQLLoading = false;
        window.updateMySQLBadges('waiting');
        console.error('Failed to load local lite4mariadb module:', err);
        throw err;
      }
    };

    async function executeSingleQuery(module, sql) {
      if (typeof module.query === 'function') return await module.query(sql);
      if (typeof module.execute === 'function') return await module.execute(sql);
      if (typeof module.exec === 'function') return await module.exec(sql);

      const queryFn = module._l4m_query || module._l4m_exec_multi;
      if (typeof queryFn !== 'function') {
        throw new Error('Neither query() nor _l4m_query exists on WASM module.');
      }

      let sqlPtr = 0;
      if (typeof module.stringToUTF8 === 'function' && typeof module._malloc === 'function') {
        const length = (module.lengthBytesUTF8 ? module.lengthBytesUTF8(sql) : sql.length * 4) + 1;
        sqlPtr = module._malloc(length);
        module.stringToUTF8(sql, sqlPtr, length);
      } else if (typeof module.allocateUTF8 === 'function') {
        sqlPtr = module.allocateUTF8(sql);
      } else if (typeof module.ccall === 'function') {
        return module.ccall('l4m_query', 'string', ['string'], [sql]);
      }

      if (!sqlPtr) {
        throw new Error('Failed to allocate SQL query in WASM memory.');
      }

      let resPtr = 0;
      try {
        if (queryFn.length >= 2) {
          resPtr = await queryFn(mariadbDbHandle, sqlPtr);
        } else {
          resPtr = await queryFn(sqlPtr);
        }
      } finally {
        if (typeof module._free === 'function') {
          module._free(sqlPtr);
        }
      }

      if (!resPtr) {
        return null;
      }

      let rawResult = '';
      if (typeof module.UTF8ToString === 'function') {
        rawResult = module.UTF8ToString(resPtr);
      }

      if (typeof module._l4m_free === 'function') {
        module._l4m_free(resPtr);
      } else if (typeof module._free === 'function') {
        module._free(resPtr);
      }

      if (rawResult && typeof rawResult === 'string') {
        const trimmed = rawResult.trim();
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try {
            return JSON.parse(trimmed);
          } catch (e) {
            return rawResult;
          }
        }
      }

      return rawResult;
    }

    function formatSQLResults(res, query) {
      const q = (query || '').trim().toUpperCase();
      const isDMLorDDL = /^(CREATE|DROP|ALTER|INSERT|UPDATE|DELETE|USE|SET|RENAME|TRUNCATE)\b/.test(q);

      if (res === null || res === undefined || res === '') {
        if (isDMLorDDL) {
          return 'Query OK, 0 rows affected (0.01 sec)';
        }
        return 'Empty set (0.00 sec)';
      }

      // If lite4mariadb returned an already formatted ASCII border table
      if (typeof res === 'string') {
        const trimmed = res.trim();
        if (trimmed.startsWith('+') || trimmed.includes('|')) {
          return trimmed;
        }
        if (trimmed.length === 0) {
          return isDMLorDDL ? 'Query OK, 0 rows affected (0.01 sec)' : 'Empty set (0.00 sec)';
        }
        return trimmed;
      }

      let rows = null;
      let cols = null;

      if (Array.isArray(res)) {
        rows = res;
      } else if (typeof res === 'object' && res !== null) {
        if (Array.isArray(res.rows)) {
          rows = res.rows;
          cols = res.columns || res.fields;
        } else if (Array.isArray(res.values)) {
          rows = res.values;
          cols = res.columns;
        } else if (res.affectedRows !== undefined || res.changes !== undefined) {
          const count = res.affectedRows ?? res.changes;
          return `Query OK, ${count} row${count === 1 ? '' : 's'} affected (0.01 sec)`;
        }
      }

      if (!rows || rows.length === 0) {
        if (isDMLorDDL) {
          return 'Query OK, 0 rows affected (0.01 sec)';
        }
        return 'Empty set (0.00 sec)';
      }

      // 2D Array formatting: [[val1, val2], ...]
      if (Array.isArray(rows[0])) {
        if (!cols || !Array.isArray(cols)) {
          cols = rows[0].map((_, i) => `Col ${i + 1}`);
        } else {
          cols = cols.map(c => (typeof c === 'object' && c !== null ? c.name || c.columnName || String(c) : String(c)));
        }

        const colWidths = cols.map((col, idx) => 
          Math.max(String(col).length, ...rows.map(r => String(r[idx] ?? 'NULL').length))
        );

        const separator = '+' + colWidths.map(w => '-'.repeat(w + 2)).join('+') + '+';
        const header = '| ' + cols.map((col, i) => String(col).padEnd(colWidths[i])).join(' | ') + ' |';
        const body = rows.map(r => 
          '| ' + r.map((val, i) => String(val ?? 'NULL').padEnd(colWidths[i])).join(' | ') + ' |'
        ).join('\n');

        return `${separator}\n${header}\n${separator}\n${body}\n${separator}\n${rows.length} row${rows.length > 1 ? 's' : ''} in set`;
      }

      // Array of objects formatting: [{ col1: val1, ... }, ...]
      if (typeof rows[0] === 'object' && rows[0] !== null) {
        const keys = Object.keys(rows[0]);
        const colWidths = {};
        keys.forEach(k => {
          colWidths[k] = Math.max(k.length, ...rows.map(row => String(row[k] ?? 'NULL').length));
        });

        const separator = '+' + keys.map(k => '-'.repeat(colWidths[k] + 2)).join('+') + '+';
        const header = '| ' + keys.map(k => k.padEnd(colWidths[k])).join(' | ') + ' |';
        const body = rows.map(row => 
          '| ' + keys.map(k => String(row[k] ?? 'NULL').padEnd(colWidths[k])).join(' | ') + ' |'
        ).join('\n');

        return `${separator}\n${header}\n${separator}\n${body}\n${separator}\n${rows.length} row${rows.length > 1 ? 's' : ''} in set`;
      }

      return JSON.stringify(res, null, 2);
    }

    window.runMySQLCode = async function(buttonEl) {
      const island = buttonEl.closest('.mysql-island') || buttonEl.closest('.code-island');
      if (!island) return;

      const sourceArea = island.querySelector('.mysqlsource textarea') || island.querySelector('.code-source textarea');
      const outputPre = island.querySelector('.mysqlterm pre') || island.querySelector('.code-term pre');
      if (!sourceArea || !outputPre) return;

      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Executing...';
      outputPre.className = 'mysql-output';
      outputPre.textContent = 'Connecting to MariaDB...';

      try {
        const mod = await window.ensureMySQL();
        outputPre.textContent = 'Executing query...';

        const rawCode = sourceArea.value.trim();
        const cleanCode = rawCode
          .replace(/--.*$/gm, '')
          .replace(/\/\*[\s\S]*?\*\//g, '');

        const queries = cleanCode
          .split(';')
          .map(q => q.trim())
          .filter(q => q.length > 0);

        let finalOutputs = [];
        const welcomeBanner = "Welcome to the MariaDB monitor. Commands end with ;\n";

        for (const query of queries) {
          try {
            const res = await executeSingleQuery(mod, query);
            finalOutputs.push(`mysql> ${query};\n${formatSQLResults(res, query)}`);
          } catch (queryErr) {
            finalOutputs.push(`mysql> ${query};\nERROR: ${queryErr.message}`);
          }
        }

        outputPre.textContent = welcomeBanner + '\n' + (finalOutputs.join('\n\n') || 'Query OK, 0 rows affected');
        
        // Auto-scroll output terminal to latest command
        const termContainer = island.querySelector('.mysqlterm');
        if (termContainer) {
          termContainer.scrollTop = termContainer.scrollHeight;
        }
      } catch (err) {
        outputPre.className = 'mysql-output mysql-err';
        outputPre.textContent = `mysql> ERROR: ${err.message}`;
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalText;
      }
    };
  </script>
</body>
</html>
