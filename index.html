<!DOCTYPE html>
<html lang="en">
<head>
  <title>Limitless - The Open Academic Archive | Degree College Notes</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The free and open source archive of high quality notes and academic resources for degree college in India">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <!-- Collapsible Sidebar Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    /* Default site font */
    :root {
      --site-font: Arial, Helvetica, "Segoe UI", sans-serif;
    }
    body,
    .sidebar,
    .markdown-section,
    .search input,
    #cusdis_thread {
      font-family: var(--site-font) !important;
    }

    /* Global smooth color transition when switching Light/Dark modes */
    body,
    .sidebar,
    .markdown-section,
    .content,
    article,
    nav,
    aside,
    input,
    button,
    .sidebar-toggle,
    #docsify-darklight-theme,
    .comments-toggle-btn {
      transition: background-color 0.5s ease,
                  color 0.5s ease,
                  border-color 0.5s ease,
                  box-shadow 0.5s ease !important;
    }

    /* Remove site title from sidebar */
    .app-name,
    .sidebar > h1 {
      display: none !important;
    }

    /* Smooth sidebar transition */
    .sidebar,
    .content {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  left 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  padding-left 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  background-color 0.5s ease,
                  color 0.5s ease !important;
    }

    /* Responsive container for YouTube embeds */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      margin: 1.5rem 0;
      border-radius: 8px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* App Loader */
    .app-loader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 85vh;
      font-family: var(--site-font);
    }

    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #e5e7eb;
      border-top-color: #42b983;
      border-radius: 50%;
      animation: 
        spin 0.85s linear infinite,
        dynamicHue 8s ease-in-out infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dynamicHue {
      0%   { border-top-color: #000000; border-right-color: #000000; }
      25%  { border-top-color: #7c3aed; border-right-color: #7c3aed; }
      50%  { border-top-color: #db2777; border-right-color: #db2777; }
      75%  { border-top-color: #059669; border-right-color: #059669; }
      100% { border-top-color: #000000; border-right-color: #000000; }
    }

    /* Top-Right Hamburger Menu with Dynamic Contrast Background */
    .sidebar-toggle {
      position: fixed !important;
      top: 14px !important;
      right: 14px !important;
      left: auto !important;
      bottom: auto !important;
      width: 38px !important;
      height: 38px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18) !important;
      cursor: pointer;
      z-index: 1000 !important;
      padding: 0 !important;
      background-color: #1e293b !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }
    .sidebar-toggle span {
      background-color: #ffffff !important;
      height: 2px !important;
      width: 18px !important;
      margin: 2px 0 !important;
      border-radius: 2px;
      transition: background-color 0.5s ease;
    }

    body.dark .sidebar-toggle,
    [data-theme="dark"] .sidebar-toggle {
      background-color: #ffffff !important;
      border-color: rgba(0, 0, 0, 0.1) !important;
    }
    body.dark .sidebar-toggle span,
    [data-theme="dark"] .sidebar-toggle span {
      background-color: #0f172a !important;
    }

    /* Dark/Light Toggle with Dynamic Contrast Background */
    #docsify-darklight-theme {
      position: fixed !important;
      right: 20px !important;
      bottom: 20px !important;
      top: auto !important;
      left: auto !important;
      z-index: 9999 !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2) !important;
      border-radius: 50% !important;
      background-color: #1e293b !important;
      color: #ffffff !important;
    }
    #docsify-darklight-theme svg {
      fill: #ffffff !important;
      stroke: #ffffff !important;
      transition: fill 0.5s ease, stroke 0.5s ease;
    }

    body.dark #docsify-darklight-theme,
    [data-theme="dark"] #docsify-darklight-theme {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    body.dark #docsify-darklight-theme svg,
    [data-theme="dark"] #docsify-darklight-theme svg {
      fill: #0f172a !important;
      stroke: #0f172a !important;
    }

    /* Collapsible Comments Section Wrapper */
    .comments-collapsible-wrapper {
      margin: 50px auto 30px auto;
      max-width: 680px;
      width: 100%;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent !important;
    }

    /* Collapsible Header Button */
    .comments-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      background-color: #1e293b;
      color: #ffffff;
      outline: none;
    }
    .comments-toggle-btn:hover {
      transform: translateY(-1px);
    }
    .comments-toggle-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .comments-toggle-btn.open svg {
      transform: rotate(180deg);
    }

    body.dark .comments-toggle-btn,
    [data-theme="dark"] .comments-toggle-btn {
      background-color: #ffffff;
      color: #0f172a;
      border-color: rgba(0, 0, 0, 0.1);
    }

    /* Panel Animation */
    .comments-collapsible-content {
      width: 100%;
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  margin-top 0.65s ease;
      opacity: 0;
      margin-top: 0;
      background: transparent !important;
    }
    .comments-collapsible-content.show {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 16px;
    }

    /* Transparent panel container that directly adopts document background */
    .comments-inner {
      overflow: hidden;
      width: 100%;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 4px 0 0 0;
    }

    #cusdis_thread {
      width: 100% !important;
      box-sizing: border-box;
      background: transparent !important;
    }
    #cusdis_thread iframe {
      width: 100% !important;
      min-height: 480px;
      border: none !important;
      display: block;
      margin: 0 auto;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading Limitless Archive</div>
    </div>
  </div>

  <script>
    window.CUSDIS_LOCALE = {
      post: 'Post',
      comment: 'Post',
      nickname: 'Nickname',
      replyContent: 'Comment',
      reply: 'Comment'
    };

    window.CUSDIS_CONFIG = {
      fields: ['nickname']
    };

    window.$docsify = {
      name: '',
      repo: '',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,

      darklightTheme: {
        siteFont: 'Arial, Helvetica, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        dark: {
          accent: '#38bdf8',
          background: '#0f172a',
          textColor: '#f1f5f9',
          codeBackgroundColor: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f8fafc'
        }
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search notes...',
        noData: 'No results found',
        depth: 3
      },

      plugins: [
        function (hook, vm) {
          function currentSiteTheme() {
            var bg = getComputedStyle(document.body).backgroundColor;
            var match = bg.match(/\d+/g);
            if (!match) return 'light';
            var r = +match[0], g = +match[1], b = +match[2];
            var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance < 0.5 ? 'dark' : 'light';
          }

          function applyIframeStyles(theme) {
            var iframe = document.querySelector('#cusdis_thread iframe');
            if (!iframe) return;

            try {
              var doc = iframe.contentDocument || iframe.contentWindow.document;
              if (!doc) return;

              if (theme === 'dark') {
                doc.documentElement.classList.add('dark');
                doc.body.classList.add('dark');
              } else {
                doc.documentElement.classList.remove('dark');
                doc.body.classList.remove('dark');
              }

              var isDark = theme === 'dark';
              var textColor = isDark ? '#f1f5f9' : '#1e293b';
              var borderColor = isDark ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.15)';
              var inputBg = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.03)';

              var style = doc.getElementById('cusdis-custom-styles');
              if (!style) {
                style = doc.createElement('style');
                style.id = 'cusdis-custom-styles';
                doc.head.appendChild(style);
              }

              style.textContent = `
                html, body {
                  background: transparent !important;
                  background-color: transparent !important;
                  color: ${textColor} !important;
                  transition: color 0.5s ease;
                }
                /* Hide Email row entirely */
                input[name="email"],
                input[type="email"],
                label[for="email"],
                div:has(> input[name="email"]),
                div:has(> input[type="email"]) {
                  display: none !important;
                }
                /* Make Nickname full width */
                input[name="nickname"],
                div:has(> input[name="nickname"]) {
                  width: 100% !important;
                  flex: 1 1 100% !important;
                }
                /* Form fields with subtle backdrop rather than solid blocks */
                input, textarea {
                  background-color: ${inputBg} !important;
                  color: ${textColor} !important;
                  border: 1px solid ${borderColor} !important;
                  border-radius: 6px !important;
                  transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
                }
                label {
                  color: ${textColor} !important;
                  font-weight: 500 !important;
                }
              `;

              // Replace label text "Reply..." or "Reply" with "Comment"
              var labels = doc.querySelectorAll('label');
              labels.forEach(function (label) {
                var txt = label.innerText.trim();
                if (txt === 'Reply...' || txt === 'Reply' || txt.indexOf('Reply') !== -1) {
                  label.innerText = 'Comment';
                }
              });

              // Replace placeholder "Reply..." with "Comment"
              var textarea = doc.querySelector('textarea[name="reply_content"], textarea');
              if (textarea && (textarea.placeholder === 'Reply...' || textarea.placeholder === 'Reply')) {
                textarea.placeholder = 'Comment';
              }

              // Replace submit button text with "Post"
              var btns = doc.querySelectorAll('button');
              btns.forEach(function (btn) {
                if (btn.innerText.trim() === 'Comment') {
                  btn.innerText = 'Post';
                }
              });
            } catch (e) {}
          }

          function syncCusdisTheme() {
            var container = document.getElementById('cusdis_thread');
            if (!container) return;
            var theme = currentSiteTheme();

            if (container.getAttribute('data-theme') !== theme) {
              container.setAttribute('data-theme', theme);
            }

            var iframe = document.querySelector('#cusdis_thread iframe');
            if (iframe && iframe.contentWindow) {
              iframe.contentWindow.postMessage(
                JSON.stringify({ from: 'cusdis', event: 'setTheme', data: theme }),
                '*'
              );
            }

            applyIframeStyles(theme);
          }

          hook.doneEach(function () {
            var contentElem = document.querySelector('.content');
            if (!contentElem) return;

            var oldWrapper = document.querySelector('.comments-collapsible-wrapper');
            if (oldWrapper) oldWrapper.remove();

            var wrapper = document.createElement('div');
            wrapper.className = 'comments-collapsible-wrapper';

            var toggleBtn = document.createElement('button');
            toggleBtn.className = 'comments-toggle-btn';
            toggleBtn.innerHTML = '<span>Discussion & Comments</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>';

            var collContent = document.createElement('div');
            collContent.className = 'comments-collapsible-content';

            var innerContainer = document.createElement('div');
            innerContainer.className = 'comments-inner';

            var container = document.createElement('div');
            container.id = 'cusdis_thread';

            innerContainer.appendChild(container);
            collContent.appendChild(innerContainer);
            wrapper.appendChild(toggleBtn);
            wrapper.appendChild(collContent);
            contentElem.appendChild(wrapper);

            container.setAttribute('data-host', 'https://cusdis.com');
            container.setAttribute('data-app-id', 'c340a0ca-72a7-41cb-b1fe-4df40bd78033');
            container.setAttribute('data-page-id', vm.route.file || 'home');
            container.setAttribute('data-page-url', window.location.href);
            container.setAttribute('data-page-title', vm.route.file || 'Home');
            container.setAttribute('data-theme', currentSiteTheme());
            container.setAttribute('data-fields', 'nickname');
            container.setAttribute('data-config', JSON.stringify({
              fields: ['nickname'],
              i18n: {
                comment: 'Post',
                reply: 'Comment',
                replyContent: 'Comment',
                nickname: 'Nickname'
              }
            }));

            if (window.CUSDIS) {
              window.CUSDIS.renderTo(container);
              var iframe = container.querySelector('iframe');
              if (iframe) {
                iframe.addEventListener('load', function () {
                  applyIframeStyles(currentSiteTheme());
                });
              }
            }

            toggleBtn.addEventListener('click', function () {
              var isOpen = collContent.classList.toggle('show');
              toggleBtn.classList.toggle('open', isOpen);
              if (isOpen) {
                syncCusdisTheme();
              }
            });

            if (!window.__cusdisThemeObserver) {
              window.__cusdisThemeObserver = new MutationObserver(syncCusdisTheme);
              window.__cusdisThemeObserver.observe(document.body, {
                attributes: true,
                attributeFilter: ['class', 'style', 'data-theme']
              });
              window.__cusdisThemeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['class', 'style', 'data-theme']
              });
            }
          });
        }
      ]
    }
  </script>

  <!-- Core Docsify Engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cusdis.com/js/cusdis.umd.js" async defer></script>
</body>
</html>
