<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./LOGO-NO-BG.png" type="image/x-icon">
  <title>Limitless - The Open Academic Archive</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The free and open source archive of high quality notes and academic resources for degree college in India">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="./styles/index.css">
  <link rel="stylesheet" href="./styles/python.css">
  <link rel="stylesheet" href="./styles/rlang.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-left">
      <a href="#/" class="header-brand">
        <img src="./LOGO-NO-BG.png" alt="Limitless Logo" class="brand-logo">
        <span class="brand-title">Limitless</span>
      </a>
    </div>
    <div class="site-header-right" id="header-toggle-slot"></div>
  </header>

  <div id="app">
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading Limitless Archive</div>
    </div>
  </div>

  <div id="sandbox-modal-backdrop" class="sandbox-modal-backdrop">
    <div class="sandbox-modal">
      <div class="sandbox-modal-title" id="sandbox-modal-title">Program Input</div>
      <div class="sandbox-modal-prompt" id="sandbox-modal-prompt">Enter value:</div>
      <input type="text" class="sandbox-modal-input" id="sandbox-modal-input" autocomplete="off" />
      <div class="sandbox-modal-actions">
        <button class="sandbox-modal-btn cancel" id="sandbox-modal-cancel">Cancel</button>
        <button class="sandbox-modal-btn submit" id="sandbox-modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script>
    window.$docsify = {
      name: '',
      repo: '',
      homepage: 'Homepage.md',
      loadSidebar: true,
      auto2top: true,

      darklightTheme: {
        siteFont: 'Arial, Helvetica, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        dark: {
          accent: '#38bdf8',
          background: '#0f172a',
          textColor: '#f1f5f9',
          codeBackgroundColor: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f8fafc'
        }
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search archive...',
        noData: 'No results found',
        depth: 3
      },

      plugins: [
        function(hook) {
          var footer = [
            '<footer class="site-footer">',
            'Made with <span class="heart">❤️</span> by Baibhav Bhattacharya, Prem Vishwakarma & Ankush Yadav',
            '</footer>'
          ].join('');

          hook.afterEach(function(html) {
            return html + footer;
          });

          hook.doneEach(function() {
            var toggleBtn = document.querySelector('.sidebar-toggle');
            var slot = document.getElementById('header-toggle-slot');
            if (toggleBtn && slot && !slot.contains(toggleBtn)) {
              slot.appendChild(toggleBtn);
            }

            if (window.__isPyodideReady) {
              updatePyodideBadges('ready');
            }
            if (window.__isWebRReady) {
              updateWebRBadges('ready');
            }

            document.querySelectorAll('.code-source textarea, .webrsource textarea, .pysource textarea').forEach(function(textarea) {
              updateCodeGutter(textarea);
            });

            if (document.querySelector('.py-island, .code-island .py-status-badge')) {
              ensurePyodide();
            }
            if (document.querySelector('.webr-island, .webr-status-badge')) {
              ensureWebR();
            }
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var sidebar = document.querySelector('.sidebar');
    var content = document.querySelector('.content');
    if (!sidebar) return;

    sidebar.addEventListener('click', function (e) {
      e.stopPropagation();
    });

    if (content) {
      content.addEventListener('click', function () {
        if (window.innerWidth <= 768 && !document.body.classList.contains('close')) {
          document.body.classList.add('close');
        }
      });
    }
  });
  </script>

  <script>
    function updateCodeGutter(textarea) {
      const container = textarea.closest('.code-source') || textarea.closest('.webrsource') || textarea.closest('.pysource');
      if (!container) return;
      const gutter = container.querySelector('.code-gutter') || container.querySelector('.webr-gutter') || container.querySelector('.py-line-numbers');
      if (!gutter) return;

      const lineCount = textarea.value.split('\n').length;
      let numbers = '';
      for (let i = 1; i <= lineCount; i++) {
        numbers += i + '\n';
      }
      gutter.textContent = numbers.slice(0, -1);
    }

    function syncCodeGutterScroll(textarea) {
      const container = textarea.closest('.code-source') || textarea.closest('.webrsource') || textarea.closest('.pysource');
      if (!container) return;
      const gutter = container.querySelector('.code-gutter') || container.querySelector('.webr-gutter') || container.querySelector('.py-line-numbers');
      if (gutter) {
        gutter.scrollTop = textarea.scrollTop;
      }
    }

    function requestSandboxInput(promptText, titleText = "Program Input", isR = false) {
      return new Promise((resolve, reject) => {
        const backdrop = document.getElementById('sandbox-modal-backdrop');
        const titleEl = document.getElementById('sandbox-modal-title');
        const promptEl = document.getElementById('sandbox-modal-prompt');
        const inputEl = document.getElementById('sandbox-modal-input');
        const submitBtn = document.getElementById('sandbox-modal-submit');
        const cancelBtn = document.getElementById('sandbox-modal-cancel');

        titleEl.textContent = titleText;
        promptEl.textContent = promptText || "Enter input:";
        inputEl.value = "";

        if (isR) {
          submitBtn.classList.add('r-btn');
        } else {
          submitBtn.classList.remove('r-btn');
        }

        backdrop.classList.add('active');
        inputEl.focus();

        function cleanup() {
          backdrop.classList.remove('active');
          submitBtn.removeEventListener('click', onDone);
          cancelBtn.removeEventListener('click', onCancel);
          inputEl.removeEventListener('keydown', onKey);
        }

        function onDone() {
          const val = inputEl.value;
          cleanup();
          resolve(val);
        }

        function onCancel() {
          cleanup();
          reject(new Error("Input cancelled by user."));
        }

        function onKey(e) {
          if (e.key === 'Enter') onDone();
          if (e.key === 'Escape') onCancel();
        }

        submitBtn.addEventListener('click', onDone);
        cancelBtn.addEventListener('click', onCancel);
        inputEl.addEventListener('keydown', onKey);
      });
    }
  </script>

  <script>
    let pyodideInstance = null;
    window.__isPyodideLoading = false;
    window.__isPyodideReady = false;

    function updatePyodideBadges(status) {
      document.querySelectorAll('.py-status-badge').forEach(function(badge) {
        if (status === 'ready') {
          badge.className = 'py-status-badge ready';
          badge.querySelector('.py-status-text').textContent = 'Python Ready';
        } else if (status === 'loading') {
          badge.className = 'py-status-badge';
          badge.querySelector('.py-status-text').textContent = 'Initializing...';
        } else {
          badge.className = 'py-status-badge';
          badge.querySelector('.py-status-text').textContent = 'Loading...';
        }
      });
    }

    async function ensurePyodide() {
      if (window.__isPyodideReady) return pyodideInstance;
      if (window.__isPyodideLoading) {
        while (!window.__isPyodideReady) {
          await new Promise(r => setTimeout(r, 100));
        }
        return pyodideInstance;
      }

      window.__isPyodideLoading = true;
      updatePyodideBadges('loading');

      try {
        if (!window.loadPyodide) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        pyodideInstance = await loadPyodide();
        window.__isPyodideReady = true;
        window.__isPyodideLoading = false;
        updatePyodideBadges('ready');
        return pyodideInstance;
      } catch (err) {
        window.__isPyodideLoading = false;
        console.error('Failed to load Pyodide:', err);
        throw err;
      }
    }

    async function runPythonCode(buttonEl) {
      const island = buttonEl.closest('.code-island') || buttonEl.closest('.py-island');
      if (!island) return;

      const sourceArea = island.querySelector('.code-source textarea') || island.querySelector('.pysource textarea');
      const outputPre = island.querySelector('.code-term pre') || island.querySelector('.pyterm pre');
      if (!sourceArea || !outputPre) return;

      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Running...';
      outputPre.className = 'py-output';
      outputPre.textContent = 'Loading packages...';

      try {
        const py = await ensurePyodide();

        await py.loadPackagesFromImports(sourceArea.value);

        outputPre.textContent = 'Executing...';

        py.setStdin({
          stdin: () => {
            const res = window.prompt("Python input():");
            return res !== null ? res + "\n" : "\n";
          }
        });

        let code = sourceArea.value;

        const inputMatches = [...code.matchAll(/input\s*\(\s*(?:["'](.*?)["'])?\s*\)/g)];
        const userValues = [];
        for (const match of inputMatches) {
          const promptText = match[1] || "Enter value:";
          const userInput = await requestSandboxInput(promptText, "Python Input Prompt", false);
          userValues.push(userInput);
        }

        let pyInputIdx = 0;
        code = code.replace(/input\s*\(\s*(?:["'](.*?)["'])?\s*\)/g, () => {
          return JSON.stringify(userValues[pyInputIdx++]);
        });

        py.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
        const result = await py.runPythonAsync(code);
        let stdout = py.runPython("sys.stdout.getvalue()");
        let stderr = py.runPython("sys.stderr.getvalue()");

        let finalOutput = '';
        if (stdout) finalOutput += stdout;
        if (stderr) finalOutput += (finalOutput ? '\n' : '') + stderr;
        if (result !== undefined && result !== null) {
          finalOutput += (finalOutput ? '\n' : '') + String(result);
        }

        outputPre.textContent = finalOutput.trim() || '(Execution completed with no output)';
      } catch (err) {
        outputPre.className = 'py-output py-err';
        outputPre.textContent = err.message;
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalText;
      }
    }
  </script>

  <script type="module">
    let webrInstance = null;
    window.__isWebRLoading = false;
    window.__isWebRReady = false;

    window.updateWebRBadges = function(status) {
      document.querySelectorAll('.webr-status-badge').forEach(function(badge) {
        if (status === 'ready') {
          badge.className = 'webr-status-badge ready';
          badge.querySelector('.webr-status-text').textContent = 'R Ready';
        } else if (status === 'loading') {
          badge.className = 'webr-status-badge';
          badge.querySelector('.webr-status-text').textContent = 'Initializing...';
        } else {
          badge.className = 'webr-status-badge';
          badge.querySelector('.webr-status-text').textContent = 'Loading...';
        }
      });
    };

    window.ensureWebR = async function() {
      if (window.__isWebRReady) return webrInstance;
      if (window.__isWebRLoading) {
        while (!window.__isWebRReady) {
          await new Promise(r => setTimeout(r, 100));
        }
        return webrInstance;
      }

      window.__isWebRLoading = true;
      window.updateWebRBadges('loading');

      try {
        const { WebR } = await import('https://webr.r-wasm.org/v0.3.3/webr.mjs');
        webrInstance = new WebR();
        await webrInstance.init();
        window.__isWebRReady = true;
        window.__isWebRLoading = false;
        window.updateWebRBadges('ready');
        return webrInstance;
      } catch (err) {
        window.__isWebRLoading = false;
        console.error('Failed to load WebR:', err);
        throw err;
      }
    };

    window.runWebRCode = async function(buttonEl) {
      const island = buttonEl.closest('.webr-island') || buttonEl.closest('.code-island');
      if (!island) return;

      const sourceArea = island.querySelector('.webrsource textarea') || island.querySelector('.code-source textarea');
      const outputPre = island.querySelector('.webrterm pre') || island.querySelector('.code-term pre');
      if (!sourceArea || !outputPre) return;

      buttonEl.disabled = true;
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = 'Running...';
      outputPre.className = 'webr-output';
      outputPre.textContent = 'Executing...';

      try {
        const r = await window.ensureWebR();
        let code = sourceArea.value;

        const readlineMatches = [...code.matchAll(/readline\s*\(\s*(?:prompt\s*=\s*)?["'](.*?)["']\s*\)/g)];
        const rValues = [];
        for (const match of readlineMatches) {
          const promptText = match[1] || "Enter R input:";
          const userInput = await requestSandboxInput(promptText, "R Input Prompt", true);
          rValues.push(userInput);
        }

        let rInputIdx = 0;
        code = code.replace(/readline\s*\(\s*(?:prompt\s*=\s*)?["'](.*?)["']\s*\)/g, () => {
          return JSON.stringify(rValues[rInputIdx++]);
        });

        const shelter = await new r.Shelter();
        const capture = await shelter.captureR(code);

        let outputText = '';
        if (capture.output && capture.output.length > 0) {
          outputText = capture.output
            .filter(item => item.type === 'stdout' || item.type === 'stderr')
            .map(item => item.data)
            .join('\n');
        }

        await shelter.purge();
        outputPre.textContent = outputText.trim() || '(Execution completed with no output)';
      } catch (err) {
        outputPre.className = 'webr-output webr-err';
        outputPre.textContent = err.message;
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalText;
      }
    };
  </script>
</body>
</html>
